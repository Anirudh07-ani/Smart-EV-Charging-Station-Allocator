# Server configuration
server.port=8080
server.address=0.0.0.0

# --- MYSQL CONFIGURATION (Commented out because MySQL is not installed/running) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/smart_ev_allocator?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- H2 IN-MEMORY DATABASE (Auto-fallback to make the app run instantly) ---
spring.datasource.url=jdbc:h2:mem:smart_ev_allocator;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
