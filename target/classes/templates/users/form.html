<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Driver Registration')}"></head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar('users')}"></div>

    <main class="w-full pt-16 bg-surface flex-grow flex items-center justify-center py-space-xl">
        <div class="w-full px-gutter max-w-lg mx-auto">
            <!-- Breadcrumb Navigation -->
            <div class="mb-space-md flex items-center gap-space-xs font-label-mono text-caption uppercase text-outline">
                <a href="/users" th:href="@{/users}" class="hover:text-primary transition-colors flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    <span>Back to Drivers</span>
                </a>
            </div>

            <!-- Form Card Container -->
            <div class="relative rounded-2xl bg-surface-container-lowest shadow-xl border border-outline-variant/30 p-space-lg sm:p-space-xl overflow-hidden">
                <!-- Ambient Glow Accent -->
                <div class="absolute -top-20 -right-20 w-64 h-64 rounded-full bg-primary/10 blur-3xl pointer-events-none"></div>

                <!-- Header -->
                <div class="flex items-center gap-space-sm mb-space-lg pb-space-md border-b border-surface-container-low">
                    <div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary shadow-sm shrink-0">
                        <span class="material-symbols-outlined text-[26px]">person_add</span>
                    </div>
                    <div>
                        <h2 class="font-display-md text-2xl text-on-surface font-bold">Register Fleet Driver</h2>
                        <p class="font-body-md text-sm text-on-surface-variant">Create authorized credentials for autonomous charging sessions.</p>
                    </div>
                </div>

                <!-- Form -->
                <form th:action="@{/users/save}" th:object="${user}" method="post" class="flex flex-col gap-space-md">
                    <input type="hidden" th:field="*{userId}"/>

                    <!-- Full Name -->
                    <div class="flex flex-col gap-1.5">
                        <label class="font-label-mono text-caption uppercase text-outline font-semibold">Full Legal Name</label>
                        <input type="text" th:field="*{name}" required placeholder="e.g. Marcus Kim"
                               class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low text-on-surface placeholder:text-outline/60 border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary/40 transition-all font-body-md"/>
                    </div>

                    <!-- Email Address -->
                    <div class="flex flex-col gap-1.5">
                        <label class="font-label-mono text-caption uppercase text-outline font-semibold">Corporate / Driver Email</label>
                        <input type="email" th:field="*{email}" required placeholder="e.g. m.kim@enterprisefleet.com"
                               class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low text-on-surface placeholder:text-outline/60 border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary/40 transition-all font-body-md"/>
                    </div>

                    <!-- Phone Number -->
                    <div class="flex flex-col gap-1.5">
                        <label class="font-label-mono text-caption uppercase text-outline font-semibold">Contact Phone Number</label>
                        <input type="text" th:field="*{phone}" required placeholder="e.g. +1 (555) 302-8819"
                               class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low text-on-surface placeholder:text-outline/60 border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary/40 transition-all font-body-md"/>
                    </div>

                    <!-- Password -->
                    <div class="flex flex-col gap-1.5">
                        <label class="font-label-mono text-caption uppercase text-outline font-semibold">Security Credential Password</label>
                        <input type="password" th:field="*{password}" required placeholder="••••••••"
                               class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low text-on-surface border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary/40 transition-all font-body-md"/>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center justify-between pt-space-lg mt-space-sm border-t border-surface-container-low">
                        <a href="/users" th:href="@{/users}"
                           class="px-space-lg py-space-sm rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface font-headline-sm text-sm transition-colors">
                            Cancel
                        </a>
                        <button type="submit"
                                class="px-space-xl py-space-sm rounded-full bg-primary hover:bg-primary-container text-on-primary font-headline-sm text-sm shadow-md hover:shadow-lg transition-all flex items-center gap-1.5">
                            <span class="material-symbols-outlined text-[18px]">badge</span>
                            <span>Issue Driver Credential</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
