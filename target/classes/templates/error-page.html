<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('System Diagnostic Notice')}"></head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar('error')}"></div>

    <main class="w-full pt-16 bg-surface flex-grow flex items-center justify-center py-space-xl">
        <div class="w-full px-gutter max-w-lg mx-auto text-center">
            <div class="rounded-2xl bg-surface-container-lowest shadow-xl border border-outline-variant/30 p-space-xl flex flex-col items-center">
                <div class="w-16 h-16 rounded-full bg-error-container text-on-error-container flex items-center justify-center mb-space-md shadow-sm">
                    <span class="material-symbols-outlined text-[32px]">warning</span>
                </div>
                <span class="font-label-mono text-caption uppercase text-error tracking-wider font-bold">Telemetry Exception</span>
                <h2 class="font-display-md text-2xl text-on-surface font-bold mt-1">Operational Notice</h2>
                
                <div class="my-space-md p-space-md rounded-xl bg-surface-container-low text-on-surface font-body-md text-sm border border-outline-variant/20 w-full text-left">
                    <span class="font-label-mono text-[10px] text-outline uppercase block mb-1">Diagnostic Message:</span>
                    <p class="text-error font-medium" th:text="${errorMessage}">An unexpected condition occurred during dispatch.</p>
                </div>

                <div class="flex items-center gap-space-sm mt-space-sm">
                    <a href="/dashboard" th:href="@{/dashboard}"
                       class="px-space-xl py-space-sm rounded-full bg-primary hover:bg-primary-container text-on-primary font-headline-sm text-sm shadow-md transition-all">
                        Return to Cockpit
                    </a>
                    <a href="/bookings" th:href="@{/bookings}"
                       class="px-space-md py-space-sm rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface font-headline-sm text-sm transition-colors">
                        View Bookings
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
